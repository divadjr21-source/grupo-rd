<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão — Grupo RD</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f8fafc; color: #334155; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { max-width: 340px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px 24px; }
    img { width: 56px; height: 56px; border-radius: 14px; }
    h1 { font-size: 18px; margin: 16px 0 8px; color: #0f172a; }
    p { font-size: 14px; color: #64748b; margin: 0 0 20px; }
    button { background: #178a49; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; font-weight: 600; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="">
    <h1>Sem conexão com a internet</h1>
    <p>Verifique o Wi-Fi ou os dados móveis e tente novamente.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
